<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AITuber Overlay</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
        }
        #container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
        }
        #subtitle {
            background: rgba(0, 0, 0, 0.8);
            padding: 30px 50px;
            border-radius: 15px;
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 30px;
            border: 3px solid white;
        }
        #mouth {
            width: 150px;
            height: 75px;
            background: #ff69b4;
            margin: 0 auto;
            border-radius: 0 0 75px 75px;
            transform-origin: center top;
            border: 3px solid white;
        }
        #status {
            margin-top: 30px;
            font-size: 24px;
            background: rgba(0,0,0,0.6);
            padding: 15px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="status">🔄 初期化中...</div>
        <div id="subtitle">待機中</div>
        <div id="mouth"></div>
    </div>
    <script>
        console.log('=== AITuber Overlay Started ===');
        const statusEl = document.getElementById('status');
        const subtitleEl = document.getElementById('subtitle');
        const mouthEl = document.getElementById('mouth');
        
        statusEl.textContent = '🔌 WebSocket接続中...';
        console.log('Connecting to WebSocket...');
        
        const wsUrl = `ws://${location.host}/ws`;
        console.log('WebSocket URL:', wsUrl);
        
        const ws = new WebSocket(wsUrl);
        
        ws.onopen = () => {
            console.log('✅ WebSocket connected!');
            statusEl.textContent = '✅ 接続成功！';
            statusEl.style.background = 'rgba(0, 255, 0, 0.3)';
            subtitleEl.textContent = 'Ready';
        };
        
        ws.onmessage = (event) => {
            console.log('Message received:', event.data);
            try {
                const data = JSON.parse(event.data);
                console.log('Parsed data:', data);
                
                if (data.type === 'utter_start') {
                    subtitleEl.textContent = data.subtitle || data.text;
                } else if (data.type === 'mouth') {
                    const scale = Math.max(0, Math.min(1, data.value));
                    mouthEl.style.transform = `scaleY(${scale})`;
                } else if (data.type === 'utter_end') {
                    mouthEl.style.transform = 'scaleY(0)';
                }
            } catch (error) {
                console.error('Error parsing message:', error);
            }
        };
        
        ws.onerror = (error) => {
            console.error('❌ WebSocket error:', error);
            statusEl.textContent = '❌ エラー発生';
            statusEl.style.background = 'rgba(255, 0, 0, 0.3)';
        };
        
        ws.onclose = () => {
            console.log('🔌 WebSocket closed');
            statusEl.textContent = '🔌 接続切断';
            statusEl.style.background = 'rgba(255, 165, 0, 0.3)';
        };
        
        // Test: Change subtitle every 2 seconds
        let counter = 0;
        setInterval(() => {
            counter++;
            console.log('Counter:', counter);
        }, 2000);
    </script>
</body>
</html>
